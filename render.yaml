services:
  - type: web
    name: aeromind-ai
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: AEROMIND_ENV
        value: production
      - key: AEROMIND_ALLOWED_ORIGINS
        value: https://aeromind-ai-eu4b.onrender.com
      - key: AEROMIND_ALLOWED_HOSTS
        value: aeromind-ai-eu4b.onrender.com,*.onrender.com,localhost,127.0.0.1
      - key: AEROMIND_SESSION_SECRET
        generateValue: true
      - key: HARDWARE_CONTROL
        value: "false"
      - key: AEROMIND_SUPERADMIN_EMAILS
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        fromDatabase:
          name: aeromind-db
          property: connectionString
databases:
  - name: aeromind-db
    plan: basic-256mb
    region: frankfurt
    databaseName: aeromind
    user: aeromind
