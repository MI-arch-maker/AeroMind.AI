services:
  - type: web
    name: aeromind-ia
    env: docker
    plan: free                 # passer à starter : pas de mise en veille + disque + OpenFOAM
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASS
        sync: false
      - key: DATA_DIR
        value: /var/data
    # Persistance (plan payé uniquement — sinon données éphémères au redéploiement) :
    # disk:
    #   name: aeromind-data
    #   mountPath: /var/data
    #   sizeGB: 1