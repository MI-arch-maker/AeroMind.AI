services:
  - type: web
    name: aeromind-ia
    env: docker
    dockerfilePath: ./Dockerfile.openfoam     # ← cette ligne
    plan: starter                              # fortement recommandé (image ~4 Go, build long)
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASS
        sync: false